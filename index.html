<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="STA — 서울 도심과 시골 들녘을 누비는 한국형 오픈월드 웹게임">
<title>STA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Gothic+A1:wght@500;700;800&display=swap">
<style>[hidden]{display:none!important}</style>
<style>
/* 레이아웃: 화면 전체 3D, 그 위에 GTA식 HUD — 왼쪽 아래 미니맵·체력, 오른쪽 위 돈·수배·무기, 오른쪽 아래 지역명·타이머, 아래 가운데 임무 자막 */
:root{
  --money:#72c26a;
  --gold:#f2c53d;
  --wasted:#d0262c;
  --ink:#050608;
  --paper:#f5f6f7;
  --muted:#aeb5bd;
  --panel:rgba(6,7,9,.72);
  --hp:#5cbf57;--armor:#4b9fe0;--led:#ff4636;--blue:#3a8dde;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-ui:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --ol:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 2px 6px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f-ui);word-break:keep-all;overflow-wrap:anywhere}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;z-index:0;transition:filter .8s}
body.gray #game{filter:grayscale(1) brightness(.72) contrast(1.15)}
body.gray #hud{opacity:0;transition:opacity .4s}
#game canvas{display:block;width:100%!important;height:100%!important;outline:none}
#input{position:fixed;inset:0;z-index:2;cursor:crosshair}
#input.drag{cursor:grabbing}
.hud{position:fixed;pointer-events:none;z-index:5}
button{font-family:var(--f-ui);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
kbd{text-shadow:none;font:800 12px/1 var(--f-ui);background:var(--paper);color:var(--ink);border-radius:3px;padding:2px 6px;margin:0 2px}

/* 오른쪽 위: 시계 · 돈 · 수배 · 무기 */
#tr{top:calc(var(--sat) + 16px);right:calc(var(--sar) + 20px);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#clock{font:800 12px/1 var(--f-ui);letter-spacing:.12em;color:var(--paper);text-shadow:var(--ol);font-variant-numeric:tabular-nums;opacity:.9}
#money{font-family:var(--f-display);font-size:34px;line-height:1.05;color:var(--money);font-variant-numeric:tabular-nums;transform:skewX(-8deg);text-shadow:var(--ol)}
#delta{position:absolute;right:calc(100% + 12px);top:22px;white-space:nowrap;font-family:var(--f-display);font-size:20px;color:var(--money);transform:skewX(-8deg);text-shadow:var(--ol);opacity:0;transition:opacity .3s}
#delta.neg{color:#ff6b5e}
#delta.on{opacity:1}
#stars{display:flex;gap:3px;font-size:24px;line-height:1}
#stars i{font-style:normal;color:rgba(255,255,255,.14);text-shadow:-1px -1px 0 rgba(0,0,0,.6),1px 1px 0 rgba(0,0,0,.6)}
#stars i.on{color:#fff;text-shadow:var(--ol)}
#stars.blink i.on{animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.touch #tr{top:calc(var(--sat) + 10px);right:calc(var(--sar) + 12px)}
#weapon{display:flex;align-items:baseline;gap:10px;margin-top:6px}
#wName{font:400 15px/1 var(--f-display);color:var(--muted);text-shadow:var(--ol)}
#wAmmo{font:400 24px/1 var(--f-display);color:var(--paper);font-variant-numeric:tabular-nums;text-shadow:var(--ol)}
#wAmmo.low{color:#ff6b5e}
.touch #weapon{display:none}
#godBadge{font:400 14px/1 var(--f-display);color:#fff;background:var(--wasted);padding:4px 8px;margin-top:4px;transform:skewX(-8deg)}

/* 왼쪽 아래: 미니맵 + 체력·방탄 */
#mini{left:calc(var(--sal) + 20px);bottom:calc(var(--sab) + 34px);width:200px;height:132px;border-radius:4px;box-shadow:0 0 0 3px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.4);background:#23282e}
#bars{left:calc(var(--sal) + 20px);bottom:calc(var(--sab) + 18px);width:200px;height:9px;display:flex;gap:3px;padding:2px;background:rgba(0,0,0,.6)}
#bars span{position:relative;height:100%;background:rgba(255,255,255,.12);overflow:hidden}
#bars span:first-child{flex:1}#bars span:last-child{flex:1}
#bars i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .2s}
#hpFill{background:var(--hp)}#arFill{background:var(--armor)}
.touch #mini{left:calc(var(--sal) + 12px);bottom:auto;top:calc(var(--sat) + 12px);width:132px;height:104px}
.touch #bars{left:calc(var(--sal) + 12px);bottom:auto;top:calc(var(--sat) + 122px);width:132px;height:7px}

/* 아래 가운데: 임무 자막 */
#topc{left:0;right:0;margin:0 auto;bottom:calc(var(--sab) + 54px);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(760px,calc(100vw - 520px))}
.touch #topc{bottom:auto;top:calc(var(--sat) + 180px);left:max(12px,var(--sal));right:max(12px,var(--sar));width:auto}
#mission{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
#mKind{font:400 13px/1 var(--f-display);color:var(--gold);letter-spacing:.06em;text-shadow:var(--ol)}
#mText{font:800 19px/1.35 var(--f-ui);color:#fff;text-shadow:var(--ol);text-wrap:balance}
.touch #mText{font-size:15px}
#mSub{font:700 13px/1.3 var(--f-ui);color:var(--muted);text-shadow:var(--ol);font-variant-numeric:tabular-nums}
/* 오른쪽 아래 막대: 시간 · 요금 */
#mTime{position:fixed;right:calc(var(--sar) + 20px);bottom:calc(var(--sab) + 150px);min-width:200px;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:7px 14px;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.72) 30%);font:400 24px/1 var(--f-display);color:#fff;font-variant-numeric:tabular-nums;text-shadow:var(--ol)}
#mTime::before{content:"남은 시간";font:800 12px/1 var(--f-ui);letter-spacing:.12em;color:var(--muted)}
#mTime:not(.ok){color:#ff6b5e}
.touch #mTime{bottom:auto;top:calc(var(--sat) + 92px);right:calc(var(--sar) + 12px);min-width:170px;font-size:20px}
#meter{position:fixed;right:calc(var(--sar) + 20px);bottom:calc(var(--sab) + 150px);min-width:220px;display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:7px 14px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.72) 25%)}
.touch #meter{bottom:auto;top:calc(var(--sat) + 92px);right:calc(var(--sar) + 12px)}
#meter .st{font:800 12px/1 var(--f-ui);letter-spacing:.1em;color:var(--led)}
#meter .st.run{color:#57f08a}
#meter .fare{font:400 24px/1 var(--f-display);color:#fff;font-variant-numeric:tabular-nums;text-shadow:var(--ol)}
#meter .night{font:800 11px/1 var(--f-ui);color:var(--gold);border:1px solid var(--gold);padding:3px 4px}

/* 오른쪽 아래: 지역명 (GTA 거리 이름처럼) */
#area{right:calc(var(--sar) + 24px);bottom:calc(var(--sab) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:3px;opacity:0;transition:opacity .5s}
#area.on{opacity:1}
#areaName{font:400 26px/1.05 var(--f-display);font-weight:400;color:#fff;transform:skewX(-8deg);text-shadow:var(--ol)}
#areaSub{font:800 12px/1 var(--f-ui);letter-spacing:.14em;color:var(--muted);text-shadow:var(--ol)}
.touch #area{bottom:auto;top:38%;right:auto;left:0;width:100%;align-items:center}
.touch #areaName{font-size:22px}

/* 속도계 */
#speedo{right:calc(var(--sar) + 24px);bottom:calc(var(--sab) + 82px);display:flex;align-items:baseline;gap:8px}
#spdNum{font:400 34px/1 var(--f-display);color:#fff;font-variant-numeric:tabular-nums;text-shadow:var(--ol);min-width:56px;text-align:right}
#spdUnit{font:800 11px/1 var(--f-ui);color:var(--muted);text-shadow:var(--ol)}
#vehName{order:-1;font:800 12px/1 var(--f-ui);color:var(--muted);text-shadow:var(--ol)}
#hpBar{position:absolute;right:0;bottom:-8px;width:90px;height:4px;background:rgba(255,255,255,.15)}
#hpBar i{display:block;height:100%;width:100%;background:var(--hp);transition:width .2s}
.touch #speedo{right:auto;left:calc(var(--sal) + 20px);bottom:calc(var(--sab) + 190px)}
.touch #spdNum{font-size:28px}

/* 왼쪽 위: GTA 도움말 상자 */
#prompt{left:calc(var(--sal) + 20px);top:calc(var(--sat) + 58px);max-width:340px;background:rgba(0,0,0,.78);padding:12px 14px;font:700 14px/1.5 var(--f-ui);opacity:0;transition:opacity .2s}
#prompt.on{opacity:1}
.touch #prompt{top:auto;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);bottom:calc(var(--sab) + 262px)}
/* 알림: 미니맵 위 */
#toast{left:calc(var(--sal) + 20px);bottom:calc(var(--sab) + 184px);width:min(340px,calc(100vw - 40px));background:rgba(0,0,0,.78);border-left:3px solid var(--gold);padding:11px 14px;font:700 14px/1.5 var(--f-ui);opacity:0;transform:translateX(-12px);transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:none}
.touch #toast{left:max(12px,var(--sal));right:max(12px,var(--sar));width:auto;bottom:auto;top:calc(var(--sat) + 262px);font-size:13px}

/* 임무 완료 / 실패 (GTA 배너) */
#big{left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 16px;opacity:0;transition:opacity .3s;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.62) 25%,rgba(0,0,0,.62) 75%,rgba(0,0,0,0))}
#big.on{opacity:1}
#big b{font:400 52px/1 var(--f-display);color:var(--gold);transform:skewX(-8deg);text-shadow:var(--ol);white-space:nowrap}
#big.fail b{color:var(--wasted)}
#big span{font:800 17px/1.3 var(--f-ui);color:#fff;text-shadow:var(--ol)}
.touch #big b{font-size:40px}
#bubbles{inset:0}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:rgba(255,255,255,.95);color:var(--ink);font:800 13px/1 var(--f-ui);padding:6px 9px;border-radius:3px;white-space:nowrap;display:none;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.95)}

/* 무기 휠 */
#wstrip{left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .2s}
#wstrip.on{opacity:1}
#wstrip::before{content:"";position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.25) 30%,rgba(0,0,0,.6) 70%,rgba(0,0,0,0) 72%)}
#wstrip div{position:absolute;left:0;top:0;width:96px;height:62px;margin:-31px 0 0 -48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transform:translate(calc(cos(var(--a)) * 108px),calc(sin(var(--a)) * 108px));background:rgba(0,0,0,.55);font:400 15px/1 var(--f-display);color:var(--muted);text-shadow:var(--ol)}
#wstrip div.on{background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none}
#wstrip small{font:800 11px/1 var(--f-ui);font-variant-numeric:tabular-nums}
#reticle{left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;display:none}
#reticle::before{content:"";position:absolute;inset:0;border:2px solid #ff3b30;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#reticle::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#ff3b30}
.hud#xhair{left:50%;top:50%;width:0;height:0}
#xhair i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.7)}
#xhair::before,#xhair::after{content:"";position:absolute;opacity:0;transition:opacity .15s;background:linear-gradient(var(--dir),#fff 0 38%,transparent 38% 62%,#fff 62%);filter:drop-shadow(0 0 1px rgba(0,0,0,.9))}
#xhair::before{--dir:90deg;left:-13px;top:-1px;width:26px;height:2px}
#xhair::after{--dir:180deg;left:-1px;top:-13px;width:2px;height:26px}
#xhair.gun::before,#xhair.gun::after{opacity:1}
#xhair.ads::before{left:-9px;width:18px}#xhair.ads::after{top:-9px;height:18px}
#xhair.hit i{background:#ff3b30}
#xhair.hit::before{--dir:90deg;background:linear-gradient(90deg,#ff3b30 0 38%,transparent 38% 62%,#ff3b30 62%)}
#xhair.hit::after{background:linear-gradient(180deg,#ff3b30 0 38%,transparent 38% 62%,#ff3b30 62%)}
#bAim{right:calc(var(--sar) + 196px);bottom:calc(var(--sab) + 40px);width:62px;height:62px;font-size:13px}
#hurt{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,rgba(170,0,0,0) 42%,rgba(170,0,0,.6) 100%);opacity:0}

/* 도구 버튼 */
#tools{position:fixed;z-index:6;top:calc(var(--sat) + 16px);left:calc(var(--sal) + 20px);display:flex;gap:4px}
.touch #tools{left:calc(var(--sal) + 12px);top:calc(var(--sat) + 138px)}
.touch #tools button{padding:7px 9px;font-size:11px}
#tools button{border:0;background:rgba(0,0,0,.6);color:var(--paper);font:800 12px/1 var(--f-ui);padding:8px 11px}
#tools button:hover{background:#fff;color:var(--ink)}

/* 터치 조작 */
#touchUI{display:none}
.touch #touchUI{display:block}
#joy{position:fixed;z-index:6;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.18);pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(245,246,247,.85);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#joyHint{position:fixed;z-index:3;left:calc(var(--sal) + 34px);bottom:calc(var(--sab) + 40px);width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font:800 12px/1.3 var(--f-ui);color:rgba(255,255,255,.7);text-align:center;pointer-events:none}
.tbtn{position:fixed;z-index:6;border:0;border-radius:50%;color:#fff;font:400 15px/1 var(--f-display);background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 4px 14px rgba(0,0,0,.35);touch-action:none}
#bFire{right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 24px);width:88px;height:88px;font-size:18px;box-shadow:inset 0 0 0 4px #ff3b30,0 4px 14px rgba(0,0,0,.35)}
#bEnter{right:calc(var(--sar) + 26px);bottom:calc(var(--sab) + 124px);width:64px;height:64px;font-size:14px}
#bEnter.hot{animation:pulse 1s ease-in-out infinite;background:rgba(255,255,255,.9);color:var(--ink)}
@keyframes pulse{50%{transform:scale(1.08)}}
#bAlt{right:calc(var(--sar) + 116px);bottom:calc(var(--sab) + 20px);width:68px;height:68px;font-size:13px;white-space:nowrap}
#bNade{right:calc(var(--sar) + 112px);bottom:calc(var(--sab) + 100px);width:58px;height:58px;font-size:13px}
#bHorn{right:calc(var(--sar) + 120px);bottom:calc(var(--sab) + 168px);width:46px;height:46px;font-size:12px}
#bWeapon{right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 204px);min-width:90px;border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
#bWeapon small{font:800 11px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.tbtn.down{background:rgba(255,255,255,.9);color:var(--ink)}
.q-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.q-row span{font:800 12px/1 var(--f-ui);letter-spacing:.12em;color:var(--muted);margin-right:6px;text-shadow:var(--ol)}
.q-row button{border:0;background:rgba(0,0,0,.55);color:var(--paper);font:800 12px/1 var(--f-ui);padding:8px 12px}
.q-row button.on{background:var(--paper);color:var(--ink)}
.q-row small{flex-basis:100%;font:600 11px/1.4 var(--f-ui);color:var(--muted);margin-top:2px}
.h-card .q-row{margin:0 20px 16px}
.h-card .q-row button{background:rgba(255,255,255,.1);color:var(--paper)}
.h-card .q-row button.on{background:var(--paper);color:var(--ink)}

/* 타이틀 (로딩 화면 느낌) */
#title{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;padding-left:max(28px,var(--sal));padding-right:max(28px,var(--sar));padding-block:calc(9vh + 32px);
  background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 70%)}
#title::before,#title::after{content:"";position:fixed;left:0;right:0;height:9vh;background:#000}
#title::before{top:0}#title::after{bottom:0}
.t-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:14px;width:min(620px,100%)}
.t-kicker{margin:0;font:800 13px/1 var(--f-ui);letter-spacing:.3em;color:var(--gold);text-shadow:var(--ol)}
.logo{margin:0;display:flex;align-items:flex-end;gap:.02em;font:400 clamp(104px,24vw,190px)/.86 "Anton","Impact","Arial Black",sans-serif;color:#fff;letter-spacing:.01em;transform:skewX(-7deg);
  text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,0 -5px 0 #000,0 5px 0 #000,-5px 0 0 #000,5px 0 0 #000,0 14px 30px rgba(0,0,0,.55)}
.logo span:nth-child(2){color:var(--gold)}
.t-tag{margin:-4px 0 0;font:400 clamp(15px,3.2vw,20px)/1 "Anton","Impact","Arial Black",sans-serif;letter-spacing:.34em;background:#000;color:#fff;padding:9px 10px 9px 14px;transform:skewX(-7deg)}
.t-sub{margin:0;font:700 16px/1.5 var(--f-ui);color:#e8ecf0;text-shadow:var(--ol);max-width:40ch}
#startBtn{margin-top:8px;border:0;background:#fff;color:var(--ink);font:400 22px/1 var(--f-display);padding:15px 40px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#startBtn:not(:disabled):hover{background:var(--gold)}
#startBtn:disabled{background:rgba(255,255,255,.25);color:#cfd4d9;box-shadow:none;cursor:default}
.t-keys{margin:0;font:700 12px/1.9 var(--f-ui);color:#c4cad0;text-shadow:var(--ol);max-width:56ch}
.t-keys kbd{font-size:11px}

/* 체포 · 사망 (GTA 화면) */
#busted,#dead{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#busted::before,#dead::before{content:"";position:absolute;left:0;right:0;top:50%;height:150px;margin-top:-82px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.6) 20%,rgba(0,0,0,.6) 80%,rgba(0,0,0,0));z-index:-1}
#busted b,#dead b{font:400 76px/1 var(--f-display);transform:skewX(-8deg);text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 6px 20px rgba(0,0,0,.6)}
#busted b{color:#fff}#dead b{color:var(--wasted)}
#busted span,#dead span{font:800 16px/1.5 var(--f-ui);text-shadow:var(--ol);padding:0 16px}

/* 조작법 (일시정지 메뉴) */

    const a=W.grid.get(gkey(gx,gz));if(!a)continue;for(const i of a){const c=W.colliders[i];if(c.q!==qStamp){c.q=qStamp;_qc.push(c);}}}

function circleWorld(x,z,r,skipNos){
  let px=0,pz=0,nx=0,nz=0,hit=false;
  for(const c of queryCols(x,z,r)){
    if(skipNos&&c.nos)continue;
    const cx=clamp(x,c.x0,c.x1),cz=clamp(z,c.z0,c.z1);let dx=x-cx,dz=z-cz;const d2=dx*dx+dz*dz;
    if(d2>=r*r)continue;let pen;

      if(m===l){dx=-1;dz=0;pen=l+r;}else if(m===rr){dx=1;dz=0;pen=rr+r;}else if(m===t){dx=0;dz=-1;pen=t+r;}else{dx=0;dz=1;pen=b+r;}}
    else{const d=Math.sqrt(d2);dx/=d;dz/=d;pen=r-d;}
    x+=dx*pen;z+=dz*pen;px+=dx*pen;pz+=dz*pen;nx+=dx;nz+=dz;hit=true;
  }

  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){const u=i/N*2-1,v=j/N*2-1,d=Math.hypot(u,v)*(1+0.12*nz(u*1.3,v*1.3));const f=d>=1?0:Math.pow(Math.cos(d*Math.PI/2),1.25);hgt.push(d>=1?-3:-1+h*f*(0.82+0.3*nz(u*2,v*2)));}

  const vert=(i,j)=>{const [px,py,pz]=P(i,j),dx=(H(Math.min(N,i+1),j)-H(Math.max(0,i-1),j))/(2*r*2/N),dz=(H(i,Math.min(N,j+1))-H(i,Math.max(0,j-1)))/(2*r*2/N),l=Math.hypot(dx,1,dz);

  for(const o of VEH)if(o!==v&&o.active)chk(o.x,o.z,o.t.wid,o.t.len,o);
  for(const p of PEDS)if(!p.hidden&&p.state!=='down')chk(p.x,p.z,0.8,0.6,p);

  if(v.nextE&&L.s>e.len-e.w*0.5-1){v.e=v.nextE;v.fwd=v.nextF;v.nextE=null;L=laneTarget(v,la);}
  let vd=cruise;

function drive(v,dt,tx,tz,vd,obstacles){

      if(lim<vd){vd=lim;if(v.vF<0.6){v.waitT+=dt;if(a.who===P||(P.inVeh&&a.who===P.inVeh)){v.honkT-=dt;if(v.honkT<=0&&v.waitT>1.4){v.honkT=4;say(v,pick(['빵빵!','좀 비켜요!','빵!']));sfxHorn(v,0.35);}}

function vehPair(a,b){

function initSkid(){const g=new THREE.BufferGeometry(),pos=new Float32Array(SKID.n*12),idx=[];for(let i=0;i<SKID.n;i++){const k=i*4;idx.push(k,k+1,k+2,k,k+2,k+3);}

  P[o]=a.lx+nx;P[o+1]=y;P[o+2]=a.lz+nz;P[o+3]=a.lx-nx;P[o+4]=y;P[o+5]=a.lz-nz;P[o+6]=x-nx;P[o+7]=y;P[o+8]=z-nz;P[o+9]=x+nx;P[o+10]=y;P[o+11]=z+nz;SKID.i=(SKID.i+1)%SKID.n;SKID.g.attributes.position.needsUpdate=true;}}a.lx=x;a.lz=z;}

function emit(kind,x,y,z,vx,vy,vz,life,s0,s1,color){
  const add=kind!=='smoke',pool=add?FX.add:FX.norm;let p;
  if(add){p=pool[FX.ia];FX.ia=(FX.ia+1)%pool.length;}else{p=pool[FX.inr];FX.inr=(FX.inr+1)%pool.length;}
  p.s.position.set(x,y,z);p.vx=vx;p.vy=vy;p.vz=vz;p.life=p.max=life;p.s0=s0;p.s1=s1;p.kind=kind;p.s.visible=true;
  p.s.material.color.set(color===undefined?0xffffff:color);p.s.scale.setScalar(s0);p.s.material.opacity=1;
}
function fxTick(dt){
  for(const pool of[FX.add,FX.norm])for(const p of pool){if(p.life<=0)continue;p.life-=dt;if(p.life<=0){p.s.visible=false;continue;}
    const k=1-p.life/p.max;p.s.position.x+=p.vx*dt;p.s.position.y+=p.vy*dt;p.s.position.z+=p.vz*dt;
    if(p.kind==='smoke'){p.vy+=(0.6-p.vy*0.5)*dt;p.vx*=1-dt;p.vz*=1-dt;p.s.material.opacity=0.55*(1-k);}
    else{if(p.kind==='spark')p.vy-=14*dt;else{p.vx*=1-dt*2;p.vz*=1-dt*2;p.vy+=dt*2;}p.s.material.opacity=1-k*k;}
    p.s.scale.setScalar(p.s0+(p.s1-p.s0)*k);}
  for(const t of FX.tr){if(t.life<=0)continue;t.life-=dt;if(t.life<=0)t.m.visible=false;}
  for(const d of FX.decals){if(d.life<=0)continue;d.life-=dt;d.m.material.opacity=Math.min(0.85,d.life/10);if(d.life<=0)d.m.visible=false;}
  if(boomLight.intensity>0)boomLight.intensity=Math.max(0,boomLight.intensity-dt*(boomLight.userData.fade||8));
}
function tracer(x0,y0,z0,x1,y1,z1){const len=Math.hypot(x1-x0,y1-y0,z1-z0);if(len<0.6)return;const t=FX.tr[FX.itr];FX.itr=(FX.itr+1)%FX.tr.length;t.m.position.set(x0,y0,z0);t.m.lookAt(x1,y1,z1);t.m.scale.set(1,1,len);t.m.visible=true;t.life=0.06;}
function flashLight(x,y,z,int,fade){boomLight.position.set(x,y,z);boomLight.intensity=Math.max(boomLight.intensity,int);boomLight.userData.fade=fade;}
function decal(x,z,r){const d=FX.decals[FX.idc];FX.idc=(FX.idc+1)%FX.decals.length;d.m.position.set(x,groundY(x,z)+0.09,z);d.m.scale.set(r,1,r);d.m.visible=true;d.life=30;d.m.material.opacity=0.85;}

  for(let i=0;i<12;i++){const a=Math.random()*6.283,sp=rnd(8,16);emit('spark',x,y+0.5,z,Math.cos(a)*sp,rnd(4,10),Math.sin(a)*sp,rnd(0.4,0.8),0.35,0.15,0xffd27a);}

    v.vx+=nx*k*14/v.t.mass;v.vz+=nz*k*14/v.t.mass;v.jy=Math.max(v.jy||0,0.01);v.jvy=Math.max(v.jvy||0,k*7/Math.sqrt(v.t.mass));v.yawRate+=(Math.random()-0.5)*k*6;

// ---------------------------------------------------------------- damage
function hurtPed(p,dmg,nx,nz,src,blast,force,melee){
  if(p.hidden||p.state==='dead')return;
  p.hp-=dmg;
  if(p.state==='lying'&&p.hp>0)return;
  if(src==='player'){if(p.cop){if(S.wanted<2)addWanted(2-S.wanted,'cop');for(const c of COPS)c.hostile=true;}else addWanted(1,'ped');}
  if(p.hp<=0){killPed(p,nx,nz,force||3,src);return;}
  if(blast){p.state='down';p.downT=2.4;p.vx=nx*force;p.vz=nz*force;p.vy=4;p.spin=(Math.random()-0.5)*6;p.m.inner.rotation.x=-0.3;}
  else{
    p.m.hit={t:melee?0.42:0.3,side:(Math.random()-0.5)*0.9};
    if(melee&&p.state!=='lying'){p.h=Math.atan2(-nx,-nz);p.x+=nx*0.32;p.z+=nz*0.32;
      if((p.hp<p.maxHp*0.38&&Math.random()<0.4)||Math.random()<0.05){p.state='down';p.downT=1.8+Math.random()*1.2;p.vx=nx*1.7;p.vz=nz*1.7;p.vy=2.1;p.spin=0;p.m.punch=null;}}
    if(!p.cop&&!p.medic&&p.state!=='wait'&&p.state!=='angry'){if(!(src==='player'&&provoke(p))&&p.state!=='down'){p.state='flee';p.fleeT=rnd(4,7);p.fx=P.x;p.fz=P.z;}}}
  if(blast&&src==='player'&&!p.cop)provoke(p);

function rideOK(v){return v&&v.active&&!v.burnt&&v.hp>0&&v!==P.inVeh&&(v.driver===null||v.driver==='npc')&&v.type!=='bus';}
function findRide(p){let best=null,bd=60;for(const v of VEH){if(!rideOK(v))continue;const d=Math.hypot(v.x-p.x,v.z-p.z)+(v.driver==='npc'?8:0);if(d<bd){bd=d;best=v;}}if(best)best.heldBy=p;return best;}
function takeRide(p,v){

function leaveRide(p,v){

function angryBrain(p,dt){
  const m=p.m;p.angryT+=dt;p.atkT-=dt;p.lineT-=dt;
  const tv=P.inVeh,tx=tv?tv.x:P.x,tz=tv?tv.z:P.z,dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz)||0.01;
  if(d>260||S.mode==='dead'||S.mode==='busted'){calm(p);return;}
  if(p.lineT<=0){p.lineT=rnd(3.5,6);say(p,pick(ANGRY_LINES),1.6);}
  if(!p.knife&&p.angryT>8){p.knife=true;giveKnife(p);say(p,'칼 맛 좀 볼래?',2);}
  let gx=tx,gz=tz,spd=6.4,moving=true;
  if(tv&&d>9){if(!rideOK(p.ride))p.ride=findRide(p);
    if(p.ride){const r=p.ride;gx=r.x;gz=r.z;if(Math.hypot(r.x-p.x,r.z-p.z)<r.t.wid/2+1.7){takeRide(p,r);return;}}}
  else p.ride=null;
  if(!p.ride&&d<1.3)moving=false;
  const mx=gx-p.x,mz=gz-p.z,l=Math.hypot(mx,mz)||1;
  if(moving){p.x+=mx/l*spd*dt;p.z+=mz/l*spd*dt;p.phase+=spd*dt*3.4;}
  p.h+=angDiff(p.h,Math.atan2(mx,mz))*Math.min(1,dt*10);

  if(p.hitDue>0){p.hitDue-=dt;if(p.hitDue<=0&&!tv&&d<2.1&&S.mode==='play'){sfxPunch(true);hurtPlayer(p.knife?rnd(9,13):rnd(4,7));if(!p.knife&&Math.random()<0.2&&P.down<=0){P.down=0.9;P.vx=dx/d*4;P.vz=dz/d*4;P.vy=2.5;}}}
  if(d<(tv?2.9:1.75)&&p.atkT<=0&&S.mode==='play'){
    p.atkT=p.knife?0.85:rnd(0.75,1.15);p.combo=((p.combo||0)+1)%4;
    if(p.knife)startPunch(m,'slash',1,0.42);else startPunch(m,p.combo===3?'hook':p.combo%2?'jab':'cross',p.combo%2?-1:1);
    if(!tv)p.hitDue=0.13;

  }
  const sw=moving?Math.sin(p.phase)*(d<4?0.35:0.7):0;m.lL.rotation.x=sw;m.lR.rotation.x=-sw;m.armL.rotation.x=-sw*0.8;m.armR.rotation.x=sw*0.8;
  m.inner.rotation.x*=0.8;
  p.y+=(groundY(p.x,p.z)-p.y)*Math.min(1,dt*10);
}
function aiAngry(v,dt){
  const p=v.angryPed;if(!p||p.state!=='angry'){v.driver=null;riderFor(v,null);return;}
  const tv=P.inVeh,tx=tv?tv.x:P.x,tz=tv?tv.z:P.z,d=Math.hypot(tx-v.x,tz-v.z);

  v.e=null;const lx=tx+(tv?tv.vx*0.4:0),lz=tz+(tv?tv.vz*0.4:0),diff=angDiff(v.h,Math.atan2(lx-v.x,lz-v.z));

  if(v.stuckT>1.4){v.revT=1.2;v.stuckT=0;}if(v.revT>0){v.revT-=dt;thr=-0.8;steer=-steer;}

function angryTick(dt){

function walkTo(p,tx,tz,spd,dt){const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz)||0.01;if(d>0.05){const st=Math.min(d,spd*dt);p.x+=dx/d*st;p.z+=dz/d*st;p.h+=angDiff(p.h,Math.atan2(dx,dz))*Math.min(1,dt*10);p.moving=true;}return d;}

  if(!v.e){const ne=nearestEdge(v.x,v.z);v.e=ne.e;v.fwd=1;v.nextE=null;}const L=followLane(v,dt,14,chooseNext);drive(v,dt,L.tx,L.tz,L.vd,true);

function ambTick(dt){

  for(const ped of PEDS){const country=ped.style==='grandma'||ped.style==='farmer';const c=pickEdgeNear(P.x,P.z,10,country?500:180,e=>country?e.zone==='country':e.zone!=='country',false);if(c)pedSpawnOn(ped,c.e,c.s);}
  updateSky(S.hour);skyFollow();updateEnv(true);S.mode='title';
  const b=$('startBtn');b.disabled=false;b.textContent='출발';
  if(data&&data.playing)startGame();
  window.__game={S,P,VEH,PEDS,W,M,PLACES,POOL,camera,renderer,startGame,actEnter,IN,K,ARM,HELI,COPS,hurtPlayer,explode,throwGrenade,tryFire,selectWeapon,PICKS,CH,AMB,runCheat,provoke,WX,toggleCheat,SPAWNED,SU,scene,POSTI:()=>POST.info,SKID,getCloud:()=>CLOUD,setCam:(y,p)=>{cam.yaw=y;cam.pitch=p;cam.dragT=5;},cam,aimInfo,pickCursor,addWanted,toast,big,showMission,showStrip,STARTS};
}
try{window.claude?.hot?.snapshot?.(()=>({money:S.money,hour:S.hour,playing:S.mode==='play'}));}catch(e){}
requestAnimationFrame(frame);
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});
})();
